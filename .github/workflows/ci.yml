name: CI

on:
  schedule:
    - cron: "0 5 */2 * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps

      - name: Verify Playwright installation
        run: python -m playwright --version

      - name: Run report automation
        env:
          REPORT_KIND: all
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          CHAOXING_PHONE: ${{ secrets.CHAOXING_PHONE }}
          CHAOXING_PWD: ${{ secrets.CHAOXING_PWD }}
        run: python main.py
